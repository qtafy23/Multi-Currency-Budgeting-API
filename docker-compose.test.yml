services:
  api:
    build:
      context: .
      target: development
    container_name: mcb-api-test
    command: python -m pytest --cov=. --cov-report=html -v
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=testing
      - TEST_POSTGRES_URL=postgresql://postgres:postgres@db:5432/mcb_test
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mcb_test
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mcb-network

  worker:
    build:
      context: .
      target: development
    container_name: mcb-celery-worker-test
    command: celery -A core.celery_app worker --loglevel=debug
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - ENV=testing
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mcb_test
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    networks:
      - mcb-network

  beat:
    build:
      context: .
      target: development
    container_name: mcb-celery-beat-test
    command: celery -A core.celery_app beat --loglevel=debug
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - ENV=testing
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mcb_test
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    networks:
      - mcb-network

  db:
    image: postgres:16-alpine
    container_name: mcb-db-test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mcb_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcb_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_test:/var/lib/postgresql/data
    networks:
      - mcb-network

  redis:
    image: redis:7-alpine
    container_name: mcb-redis-test
    networks:
      - mcb-network

volumes:
  postgres_test:

networks:
  mcb-network:
    driver: bridge
