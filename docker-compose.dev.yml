services:
  api:
    build:
      context: .
      target: development
    container_name: mcb-api-dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mcb_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - mcb-network

  worker:
    build:
      context: .
      target: development
    container_name: mcb-celery-worker-dev
    command: celery -A core.celery_app worker --loglevel=debug
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mcb_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - mcb-network

  beat:
    build:
      context: .
      target: development
    container_name: mcb-celery-beat-dev
    command: celery -A core.celery_app beat --loglevel=debug
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mcb_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - mcb-network

  db:
    image: postgres:16-alpine
    container_name: mcb-db-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mcb_dev
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mcb-network

  redis:
    image: redis:7-alpine
    container_name: mcb-redis-dev
    ports:
      - "6379:6379"
    networks:
      - mcb-network

volumes:
  postgres_dev:

networks:
  mcb-network:
    driver: bridge
